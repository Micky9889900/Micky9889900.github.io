name: Refresh VPN servers
on:
  schedule: [{ cron: "17 */3 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: refresh-servers, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/update_servers.py
      - run: python3 -c "import json;d=json.load(open('vpn/servers.json'));assert len(d['servers'])>=15"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add vpn/servers.json
          git diff --cached --quiet || (git commit -m "Refresh VPN servers" && git push)
